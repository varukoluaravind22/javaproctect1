
# ==========================================
# Application Configuration
# ==========================================

spring.application.name=devops-website
server.port=8081

# ==========================================
# Logging Configuration
# ==========================================

logging.level.root=INFO
logging.level.com.dev.aravind.test=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=INFO

# Console Log Pattern - Log level first
logging.pattern.console=%-5level %d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %logger{36} - %msg%n


# ==========================================
# Log File Configuration
# ==========================================

logging.file.name=logs/devops-website.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

# ==========================================
# Spring Boot Actuator Configuration
# ==========================================

# Expose Actuator endpoints over HTTP
management.endpoints.web.exposure.include=health,info,prometheus

# Enable health endpoint
management.endpoint.health.enabled=true

# Enable Kubernetes liveness and readiness probes
management.endpoint.health.probes.enabled=true

# Enable Prometheus endpoint
management.endpoint.prometheus.enabled=true

# Application information
management.info.env.enabled=true

# Application metrics
management.metrics.tags.application=${spring.application.name}
