
# ==========================================
# Application Configuration
# ==========================================

spring.application.name=devops-website

# Server Configuration
server.port=8081


# ==========================================
# Logging Configuration
# ==========================================

# Root logging level
logging.level.root=INFO

# Application package logging
logging.level.com.dev.aravind.test=INFO

# Spring Boot logging
logging.level.org.springframework.boot=INFO

# Spring Web logging
logging.level.org.springframework.web=INFO


# ==========================================
# Console Log Pattern
# ==========================================

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n


# ==========================================
# Log File Configuration
# ==========================================

# Store application logs in a file
logging.file.name=logs/devops-website.log

# Maximum log file size
logging.logback.rollingpolicy.max-file-size=10MB

# Keep previous log files
logging.logback.rollingpolicy.max-history=7
