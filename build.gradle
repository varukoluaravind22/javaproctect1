plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.sonarqube' version '7.2.3.7755'
    id 'org.owasp.dependencycheck' version '13.0.0'
    id 'jacoco'
}
jacoco {
    toolVersion = '0.8.14'
}

tasks.test {
    useJUnitPlatform()
    finalizedBy tasks.jacocoTestReport
}

tasks.jacocoTestReport {
    dependsOn tasks.test

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
version = System.getenv('BUILD_NUMBER') ?: '1'


// OWASP Dependency-Check
dependencyCheck {
    nvd {
        apiKey = System.getenv('NVD_API_KEY')
        delay = 3500
    }

    failBuildOnCVSS = 10.0
    formats = ['HTML', 'XML']
}

// SonarQube
sonarqube {
    properties {
        property "sonar.projectKey", "Test-project"
        property "sonar.projectName", "Test-project"
        property "sonar.host.url", "http://sonarqube:9000/"
    }
}

group = 'com.dev.aravind'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Prometheus metrics
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // Spring Web MVC
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    // Tomcat security upgrade
    constraints {
        implementation('org.apache.tomcat.embed:tomcat-embed-core:11.0.25')
        implementation('org.apache.tomcat.embed:tomcat-embed-websocket:11.0.25')

        // Jackson security upgrade
        implementation('tools.jackson.core:jackson-core:3.1.7')
        implementation('tools.jackson.core:jackson-databind:3.1.7')
    }

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'

    // Spring Boot MVC Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('bootJar') {
    archiveFileName = "devops-website-${version}.jar"
}
tasks.named('test') {
    useJUnitPlatform()
}
